  <script>
    // All state is memory-only. No fetch, provider SDK, localStorage, cookies or business endpoints.
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const icon = (name, cls='') => `<svg aria-hidden="true" class="${cls}"><use href="#i-${name}"/></svg>`;
    const sampleRows = [
      ['我昨天买的耳机还没发货，现在不想要了，可以直接退款吗？','申请退款','未发货 · 主动取消'],
      ['我上周申请的退款，怎么到现在银行卡里还没收到？','查询退款进度','已申请 · 到账查询'],
      ['收到的杯子有一道裂纹，我应该在哪里申请退货退款？','申请退款','质量问题 · 已收货'],
      ['退款页面显示处理成功了，一般还需要多久才能到账？','查询退款进度','已处理 · 到账时效'],
      ['这件外套尺码不合适，吊牌还在，能退掉吗？','申请退款','尺码不合 · 退货条件'],
      ['商家说退款已经退回原支付账户了，我在哪里能查到？','查询退款进度','退款去向 · 查询入口'],
      ['我不小心重复买了两份课程，想退掉其中一份，应该怎么操作？','申请退款','重复购买 · 部分退款'],
      ['订单里退款一直显示审核中，能帮我看看进展吗？','查询退款进度','审核中 · 进度查询']
    ];
    const seeds = [
      {id:'refund',title:'退款意图识别 · 8 条',group:'客服测试集',result:'退款意图识别测试集',kind:'generation',prompt:'根据这份需求文档，生成 8 条退款意图识别测试数据。问题要像用户平时说的话，两类各 4 条。',attachment:true},
      {id:'clean',title:'清洗客服问答数据',group:'客服测试集',result:'客服问答 · 清洗结果',kind:'clean',prompt:'帮我清洗这份客服问答，整理多余空格和标点，保留原意。',attachment:true},
      {id:'plan',title:'用户意图分类方案',group:'客服测试集',result:'用户意图分类方案',kind:'plan',prompt:'先帮我设计一个客服意图识别测试集方案，暂时不要生成数据。'},
      {id:'travel',title:'扩写出行咨询问题',group:'数据整理',result:'出行咨询测试集',kind:'travel',prompt:'围绕行程安排，再扩写几条自然的用户提问，注意不要重复。'},
      {id:'source',title:'整理原始资料',group:'数据整理',result:'原始资料整理方案',kind:'plan',prompt:'我有几份不同格式的资料，帮我先梳理一下整理步骤。'}
    ];
    let sessions = seeds.map(s=>({...s,turns:[],saved:false,draft:'',attached:false,stage:'idle',hasResult:s.kind!=='plan'}));
    let active='refund',tab='preview',model='qwen-new',dialogMode='save',toastTimer,newIndex=0;
    const state=()=>sessions.find(s=>s.id===active);
    function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').classList.add('visible');toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),2600)}
    function actions(){return `<div class="message-actions"><button class="icon" data-action="copy" aria-label="复制回复" title="复制回复">${icon('copy')}</button><button class="icon" data-action="like" aria-label="喜欢这条回复" title="喜欢这条回复">${icon('like')}</button><button class="icon" data-action="plan" aria-label="查看方案" title="查看方案">${icon('list')}</button></div>`}
    function attachment(){return `<button class="user-attachment" data-action="document"><span class="file-icon">${icon('file')}</span><span class="file-info">客服意图识别需求.md<small>背景文档 · 示例附件</small></span></button>`}
    function process(s){const clean=s.kind==='clean';return `<details class="process"><summary>已完成 ${clean?'2':'3'} 个步骤 · 用时 ${clean?'8':'24'} 秒 ${icon('chevron','chevron')}</summary><div class="process-content"><div class="process-step">${icon('check')}<span>${clean?'检查字段与输入范围':'读取文档，整理分类要求'}</span><small>${clean?'2':'3'} 秒</small></div><div class="process-step">${icon('check')}<span>${clean?'整理空格与标点，保留原意':'生成 8 条问题，覆盖不同用户场景'}</span><small>${clean?'6':'18'} 秒</small></div>${clean?'':`<div class="process-step">${icon('check')}<span>检查字段、分类数量与重复项</span><small>3 秒</small></div>`}<div class="reasoning-note">以上为预设的执行记录示例，不是模型的真实思考内容。</div></div></details>`}
    function resultCard(s){return `<button class="result-link" data-action="preview"><span class="file-icon">${icon('grid')}</span><span class="result-info"><b>${esc(s.result)}</b><span>8 条记录 · ${s.saved?'草稿已保存（模拟）':'待核对与保存'}</span></span>${icon('chevron')}</button>`}
    function assistant(s){if(s.kind==='plan')return `<div class="assistant-turn">${process(s)}<p>可以先按<strong>业务场景、用户意图和期望结果</strong>来组织这份测试集。</p><h2>建议先把范围确定下来</h2><ul><li>选取常见场景，也保留少量边界情况。</li><li>每条问题表达完整，避免依赖上一轮对话。</li><li>分类名称保持统一，方便后续统计与评测。</li></ul><p>右侧是一份示例方案。你可以先调整要求，再决定是否生成。</p><button class="result-link" data-action="plan"><span class="file-icon">${icon('list')}</span><span class="result-info"><b>${esc(s.result)}</b><span>仅规划 · 尚未生成数据</span></span>${icon('chevron')}</button>${actions()}</div>`;
      return `<div class="assistant-turn">${process(s)}<p>${s.kind==='clean'?'已经整理好这份示例数据。主要处理了多余空格、标点和格式，<strong>原问题含义与分类保持不变</strong>。':s.kind==='travel'?'已准备好一组出行咨询示例，覆盖行程安排、交通衔接和时间规划。':'已按文档要求准备好 <strong>8 条测试数据</strong>，两类各 4 条。问题采用用户日常问法，不依赖额外的对话背景。'}</p><h2>${s.kind==='clean'?'本次处理内容':'这份测试集包含什么'}</h2><table class="plan-table"><thead><tr><th>${s.kind==='clean'?'处理项':'意图类别'}</th><th>${s.kind==='clean'?'结果':'数量'}</th><th>${s.kind==='clean'?'范围':'覆盖场景'}</th></tr></thead><tbody>${s.kind==='clean'?'<tr><td>首尾空格</td><td>已整理</td><td>问题字段</td></tr><tr><td>标点与格式</td><td>已统一</td><td>问题字段</td></tr>':s.kind==='travel'?'<tr><td>行程安排</td><td>4 条</td><td>时间、景点与路线</td></tr><tr><td>交通咨询</td><td>4 条</td><td>换乘、车票与出行</td></tr>':'<tr><td>申请退款</td><td>4 条</td><td>未发货、质量问题、重复购买等</td></tr><tr><td>查询退款进度</td><td>4 条</td><td>审核状态、到账时间、退款去向等</td></tr>'}</tbody></table><p>每条记录包含<strong>问题、期望输出和 Metadata</strong>。你可以在右侧逐条查看，也可以继续告诉我需要调整的地方。</p>${resultCard(s)}<p class="success-line">${icon('check')}已完成结构与数量检查，内容仍需你核对。</p>${actions()}</div>`}
    function rows(s){if(s.kind!=='travel')return sampleRows;return [['周五晚上到杭州，周日下午返程，两天怎么安排比较轻松？','行程安排','周末 · 城市游'],['带爸妈去苏州三天，能帮我安排一个少走路的路线吗？','行程安排','家庭 · 慢节奏'],['下午三点落地，晚上想逛西湖，住在哪一片方便？','行程安排','住宿 · 时间安排'],['下雨的话，原来的户外行程可以换成哪些室内活动？','行程安排','天气 · 备选方案'],['从机场到市区酒店，地铁和打车哪个方便？','交通咨询','机场 · 接驳'],['高铁站到景区有直达公交吗，大约要多久？','交通咨询','高铁 · 公交'],['一家四口带行李，两个景点之间怎么换乘省事？','交通咨询','家庭 · 换乘'],['我晚上十一点到站，还能坐公共交通去市中心吗？','交通咨询','夜间 · 末班车']]}
    function renderSidebar(){const q=$('search').value.trim().toLowerCase();const visible=sessions.filter(s=>s.title.toLowerCase().includes(q));$('conversationList').innerHTML=`<div class="list-label">项目</div>`+[...new Set(visible.map(s=>s.group))].map(group=>`<button class="project-heading" data-group="${esc(group)}" aria-expanded="true">${icon('folder')}${esc(group)}${icon('down','chevron')}</button><div class="project-conversations">${visible.filter(s=>s.group===group).map(s=>`<button class="conversation ${s.id===active?'selected':''}" data-session="${s.id}" ${s.id===active?'aria-current="page"':''}><span class="name">${esc(s.title)}</span>${s.stage==='running'?'<span class="dot"></span>':''}</button>`).join('')}</div>`).join('')+(visible.length?'':'<div class="no-results">没有匹配的会话</div>')}
    function renderMessages(){const s=state();$('topTitle').textContent=s.group;let html='';if(s.prompt){html=`<div class="user-turn">${s.attachment?attachment():''}<div class="user-bubble">${esc(s.prompt)}</div></div>${assistant(s)}`}
      if(!s.prompt&&!s.turns.length)html=`<div class="welcome">${icon('spark')}<h1>今天想处理什么数据？</h1><p>从一个想法、一份文档，或一组已有数据开始。</p><div class="suggestions"><button data-suggest="根据这份文档，生成 8 条意图识别测试数据。">根据文档生成</button><button data-suggest="帮我清洗这份数据，保留原意。">清洗已有数据</button><button data-suggest="把这些问题改得更自然一些。">改写问题表达</button></div></div>`;
      html+=s.turns.map(t=>t.role==='user'?`<div class="user-turn">${t.attached?attachment():''}<div class="user-bubble">${esc(t.text)}</div></div>`:`<div class="assistant-turn"><p>${esc(t.text)}</p>${t.result?resultCard(s):''}${actions()}</div>`).join('');
      if(s.stage==='running')html+=`<div class="running-note" role="status"><span class="spinner"></span>${['正在读取示例要求…','正在生成示例数据…','正在检查示例结果…'][s.step||0]}</div>`;
      if(s.stage==='paused')html+=`<div class="paused-note" role="status"><span>演示已暂停，当前进度已保留。</span><button data-action="resume">继续演示</button></div>`;
      $('messages').innerHTML=html;$('statusDot').classList.toggle('running',s.stage==='running');$('statusDot').title=s.stage==='running'?'示例运行中':'未连接模型';syncSend()}
    function renderWorkspace(){const s=state();document.querySelectorAll('[data-tab]').forEach(b=>{b.setAttribute('aria-selected',b.dataset.tab===tab);b.tabIndex=b.dataset.tab===tab?0:-1});$('workspaceBody').setAttribute('aria-labelledby','tab-'+tab);let html='';
      if(tab==='document'){html=`<div class="eyebrow">背景文档</div><h2>客服意图识别需求</h2><p class="description">Markdown · 示例内容</p><div class="prose"><p>这份测试数据用于检查客服助手能否准确识别用户的退款意图。</p><h3>1. 分类范围</h3><ul><li><strong>申请退款：</strong>用户希望发起退款、退货或取消购买。</li><li><strong>查询退款进度：</strong>用户已经申请退款，想了解审核、到账时间或退款去向。</li></ul><h3>2. 问题表达</h3><p>使用自然、完整的用户问法。可以包含时间、订单状态等场景信息，避免把问题写成标签或关键词。</p><blockquote>“我上周申请的退款，怎么到现在还没收到？”</blockquote><h3>3. 输出格式</h3><p>问题：完整用户问题。<br>期望输出：对应意图类别。<br>Metadata：记录场景及分类信息。</p><h3>4. 数量与质量</h3><p>共 8 条，两类各 4 条。同类问题覆盖不同场景，避免仅替换词语形成重复。</p></div><div class="notice-row">${icon('file')}原型内置的示例文档</div>`}
      else if(tab==='plan'){html=`<div class="eyebrow">工作方案</div><h2>${s.kind==='clean'?'清洗客服问答':s.kind==='travel'?'扩写出行咨询':'生成意图识别测试集'}</h2><p class="description">先明确范围，再处理与核对。</p>${[['明确输入与要求','参考示例需求，固定数量、字段和分类范围。'],[s.kind==='clean'?'清洗记录':'生成测试数据','保留完整语义，覆盖不同场景，不改动原始资料。'],['核对结果','检查字段、数量及重复内容，交由用户审核。'],['保存为草稿','确认目标名称后保存，后续可继续编辑。']].map(([title,desc],i)=>`<div class="outline-item"><span class="num">${i+1}</span><div><strong>${title}</strong><p>${desc}</p></div></div>`).join('')}<div class="notice-row">${icon('lock')}仅演示方案，不触发实际任务</div>`}
      else if(!s.hasResult){html=`<div class="empty-workspace">${icon('grid')}<p>还没有处理结果</p><p>生成后，你可以在这里核对数据。</p></div>`}
      else{html=`<div class="eyebrow">${s.saved?'测试集草稿 · 示例':'处理成果 · 示例'}</div><div class="workspace-title"><h2>${esc(s.result)}</h2></div><p class="description">8 条记录 · ${s.kind==='travel'?'行程与交通咨询':'两类意图，各 4 条'}<br>${s.saved?'已模拟保存，未写入项目。':'请先核对内容，再保存为测试集草稿。'}</p><div class="preview-filter"><b>全部记录</b><span class="grow"></span><span>8 条</span><button class="icon" data-action="export" aria-label="下载示例 JSONL" title="下载示例 JSONL">${icon('download')}</button></div>${rows(s).map((r,i)=>`<div class="data-row"><span class="row-number">${String(i+1).padStart(2,'0')}</span><div class="row-copy"><p>${esc(r[0])}</p><span class="row-tag">${esc(r[1])}</span><button class="row-more" data-row="${i}" aria-expanded="false">Metadata ${icon('chevron')}</button><div class="row-detail" id="row-${i}" hidden>场景：${esc(r[2])}<br>来源：按示例文档生成<br>数据性质：静态演示</div></div></div>`).join('')}<p class="workspace-note">以上记录均为静态样例，用于查看字段与工作区布局。</p>`}
      $('workspaceBody').innerHTML=html;$('workspaceFooter').hidden=tab!=='preview'||!s.hasResult;$('workspaceFooter').innerHTML=`<div class="foot-summary"><span>${s.saved?'已模拟保存':'待保存 · 8 条记录'}</span><span>原始资料保持不变</span></div><button class="save" data-action="save">${icon(s.saved?'check':'plus')}${s.saved?'查看草稿摘要':'保存为草稿'}</button>`;
    }
    function syncSend(){const s=state();$('send').disabled=s.stage!=='running'&&!$('prompt').value.trim();$('send').setAttribute('aria-label',s.stage==='running'?'停止演示':'发送消息');$('send').innerHTML=icon(s.stage==='running'?'stop':'arrow');$('composerHint').textContent=s.stage==='running'?'示例运行中':s.stage==='paused'?'演示已暂停':'本次仅演示交互'}
    function renderAll(){renderSidebar();renderMessages();renderWorkspace();$('prompt').value=state().draft||'';renderAttachment();syncSend()}
    function renderAttachment(){$('attachments').innerHTML=state().attached?`<span class="attachment-chip">${icon('file')}客服意图识别需求.md<button type="button" class="icon" data-action="detach" aria-label="移除示例附件">${icon('close')}</button></span>`:''}
    function bottom(){$('chatScroll').scrollTop=$('chatScroll').scrollHeight}
    function openTab(next){tab=next;$('app').classList.remove('no-workspace');renderWorkspace()}
    function selectSession(id){state().draft=$('prompt').value;active=id;renderAll();$('chatScroll').scrollTop=0;if(innerWidth<=640)$('app').classList.add('no-sidebar')}
    function tick(s){s.timer=setTimeout(()=>{if(s.stage!=='running')return;if(s.step<2){s.step++;if(active===s.id){const near=$('chatScroll').scrollHeight-$('chatScroll').scrollTop-$('chatScroll').clientHeight<90;renderMessages();if(near)bottom()}tick(s)}else{s.stage='idle';s.hasResult=true;s.saved=false;s.turns.push({role:'assistant',text:'示例处理已完成。这里展示一份预设的 8 条测试数据，用于体验核对、调整和保存流程；没有调用真实模型。',result:true});if(active===s.id){const near=$('chatScroll').scrollHeight-$('chatScroll').scrollTop-$('chatScroll').clientHeight<90;renderMessages();renderWorkspace();renderSidebar();if(near)bottom()}}},2200)}
    function send(){const s=state();if(s.stage==='running'){clearTimeout(s.timer);s.stage='paused';renderMessages();renderSidebar();bottom();return}const text=$('prompt').value.trim();if(!text)return;if(s.stage==='paused'){clearTimeout(s.timer);s.stage='idle'}s.turns.push({role:'user',text,attached:s.attached});if(!s.prompt&&s.turns.length===1){s.title=text.slice(0,18);s.result='客服意图识别测试集'}s.draft='';s.attached=false;$('prompt').value='';$('prompt').style.height='';s.stage='running';s.step=0;renderAttachment();renderMessages();renderSidebar();bottom();tick(s)}
    function openDialog(mode){dialogMode=mode;const s=state();$('dialogTitle').textContent=mode==='save'?'保存为草稿':mode==='rename'?'重命名会话':'草稿摘要';$('dialogDescription').textContent=mode==='save'?'将这 8 条示例记录保存为一份草稿。此操作仅改变原型中的展示状态。':mode==='rename'?'名称仅在当前原型中生效。':'8 条记录 · 示例草稿。没有创建真实测试集，也没有写入项目数据。';$('dialogLabel').textContent=mode==='rename'?'会话名称':'测试集名称';$('dialogName').value=mode==='rename'?s.title:s.result;$('dialogName').readOnly=mode==='summary';$('dialogSubmit').textContent=mode==='summary'?'知道了':mode==='rename'?'保存名称':'确认保存';$('dialog').showModal();if(mode!=='summary')$('dialogName').select()}
    document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.session){selectSession(b.dataset.session);return}if(b.dataset.tab){openTab(b.dataset.tab);return}if(b.dataset.group){const open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',!open);b.nextElementSibling.hidden=open;return}if(b.dataset.row!==undefined){const d=$('row-'+b.dataset.row);d.hidden=!d.hidden;b.setAttribute('aria-expanded',!d.hidden);return}if(b.dataset.suggest){$('prompt').value=b.dataset.suggest;state().draft=$('prompt').value;syncSend();$('prompt').focus();return}if(b.dataset.model){model=b.dataset.model;$('modelName').textContent=model;$('modelMenu').hidden=true;$('modelTrigger').setAttribute('aria-expanded','false');toast('已切换示例模型，不发起实际请求');return}
      const action=b.dataset.action;if(!action)return;
      if(action!=='menu'){$('threadMenu').hidden=true;$('menuTrigger').setAttribute('aria-expanded','false')}
      if(action==='new'){state().draft=$('prompt').value;const id='new-'+(++newIndex);sessions.unshift({id,title:'新会话',group:'客服测试集',result:'客服意图识别测试集',kind:'generation',turns:[],saved:false,draft:'',attached:false,stage:'idle',hasResult:false});active=id;tab='preview';renderAll();if(innerWidth<=640)$('app').classList.add('no-sidebar');$('prompt').focus()}
      if(action==='sidebar')$('app').classList.toggle('no-sidebar');
      if(action==='workspace')$('app').classList.toggle('no-workspace');
      if(action==='overlay'){$('app').classList.add('no-workspace');if(innerWidth<=640)$('app').classList.add('no-sidebar')}
      if(action==='search'){$('app').classList.remove('no-sidebar');$('searchWrap').hidden=false;$('search').focus()}
      if(action==='recent'){$('app').classList.remove('no-sidebar');$('search').value='';renderSidebar();toast('已显示全部最近会话')}
      if(['preview','plan','document'].includes(action))openTab(action);
      if(action==='attach'){state().attached=true;renderAttachment();toast('已添加内置示例文档');$('prompt').focus()}
      if(action==='detach'){state().attached=false;renderAttachment()}
      if(action==='model'){$('modelMenu').hidden=!$('modelMenu').hidden;b.setAttribute('aria-expanded',!$('modelMenu').hidden)}
      if(action==='menu'){$('threadMenu').hidden=!$('threadMenu').hidden;b.setAttribute('aria-expanded',!$('threadMenu').hidden)}
      if(action==='bottom')bottom();
      if(action==='resume'){state().stage='running';renderMessages();renderSidebar();bottom();tick(state())}
      if(action==='save')openDialog(state().saved?'summary':'save');
      if(action==='rename')openDialog('rename');
      if(action==='cancelDialog')$('dialog').close();
      if(action==='like'){b.style.color='#3583f5';b.setAttribute('aria-pressed','true');toast('已记录此页的演示反馈')}
      if(action==='copy'){try{await navigator.clipboard.writeText(b.closest('.assistant-turn').innerText);toast('已复制回复')}catch{toast('请选中回复文字复制')}}
      if(action==='reset'){const s=state();clearTimeout(s.timer);s.turns=[];s.saved=false;s.draft='';s.attached=false;s.stage='idle';const original=seeds.find(x=>x.id===s.id);if(original)Object.assign(s,original);s.hasResult=!!s.prompt&&s.kind!=='plan';renderAll();toast('已重置当前会话的模拟状态')}
      if(action==='export'){if(!state().hasResult){toast('当前会话还没有示例数据');return}const content=rows(state()).map(r=>JSON.stringify({question:r[0],expectedOutput:r[1],metadata:{scenario:r[2],demo:true}})).join('\n');const url=URL.createObjectURL(new Blob([content],{type:'application/x-ndjson'}));const a=document.createElement('a');a.href=url;a.download='EvalBase-静态示例.jsonl';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下载 8 条静态示例数据')}
    });
    $('composer').addEventListener('submit',e=>{e.preventDefault();send()});
    $('prompt').addEventListener('input',()=>{state().draft=$('prompt').value;$('prompt').style.height='auto';$('prompt').style.height=Math.min($('prompt').scrollHeight,140)+'px';syncSend()});
    $('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(state().stage!=='running')send()}});
    $('search').addEventListener('input',renderSidebar);
    $('chatScroll').addEventListener('scroll',()=>{$('jumpBottom').hidden=$('chatScroll').scrollHeight-$('chatScroll').scrollTop-$('chatScroll').clientHeight<150});
    $('dialogForm').addEventListener('submit',e=>{e.preventDefault();const s=state(),name=$('dialogName').value.trim();if(!name)return;if(dialogMode==='rename'){s.title=name;renderSidebar();toast('会话已重命名')}if(dialogMode==='save'){s.result=name;s.saved=true;s.turns.push({role:'assistant',text:'已模拟保存为草稿「'+name+'」，共 8 条记录。你可以在右侧查看草稿摘要。',result:true});renderMessages();renderWorkspace();bottom();toast('已模拟保存 · 未写入真实项目')}$('dialog').close()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('threadMenu').hidden=true;$('modelMenu').hidden=true;$('menuTrigger').setAttribute('aria-expanded','false');$('modelTrigger').setAttribute('aria-expanded','false')}if(e.target.matches('[data-tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=['preview','plan','document'];let index=tabs.indexOf(tab);index=e.key==='Home'?0:e.key==='End'?2:(index+(e.key==='ArrowRight'?1:2))%3;openTab(tabs[index]);$('tab-'+tab).focus()}});
    let dragging=false;const resizeTo=w=>{w=Math.round(Math.max(330,Math.min(w,650,innerWidth-650)));document.documentElement.style.setProperty('--workspace',w+'px');$('resize').setAttribute('aria-valuenow',w)};
    $('resize').addEventListener('pointerdown',e=>{dragging=true;$('resize').setPointerCapture(e.pointerId);document.body.style.userSelect='none'});$('resize').addEventListener('pointermove',e=>{if(dragging)resizeTo(innerWidth-e.clientX)});const endDrag=()=>{dragging=false;document.body.style.userSelect=''};$('resize').addEventListener('pointerup',endDrag);$('resize').addEventListener('pointercancel',endDrag);$('resize').addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();resizeTo($('workspace').getBoundingClientRect().width+(e.key==='ArrowLeft'?20:-20))}});
    if(innerWidth<=1000)$('app').classList.add('no-workspace');if(innerWidth<=640)$('app').classList.add('no-sidebar');
    renderAll();
  </script>
</body>
