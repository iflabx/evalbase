      if(action==='like'){b.style.color='var(--primary)';b.setAttribute('aria-pressed','true');toast('已记录此页的演示反馈')}
      if(action==='copy'){try{await navigator.clipboard.writeText(b.closest('.assistant-turn').innerText);toast('已复制回复')}catch{toast('请选中回复文字复制')}}
      if(action==='reset'){const s=state();clearTimeout(s.timer);s.turns=[];s.saved=false;s.draft='';s.attached=false;s.stage='idle';const original=seeds.find(x=>x.id===s.id);if(original)Object.assign(s,original);s.hasResult=!!s.prompt&&s.kind!=='plan';s.openTabs=[];s.activeTab=null;s.workspaceVisible=false;renderAll();toast('已重置当前会话的模拟状态')}
      if(action==='export'){if(!state().hasResult){toast('当前会话还没有示例数据');return}const content=rows(state()).map(r=>JSON.stringify({question:r[0],expectedOutput:r[1],metadata:{scenario:r[2],demo:true}})).join('\n');const url=URL.createObjectURL(new Blob([content],{type:'application/x-ndjson'}));const a=document.createElement('a');a.href=url;a.download='EvalBase-静态示例.jsonl';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下载 8 条静态示例数据')}
    });
    $('composer').addEventListener('submit',e=>{e.preventDefault();send()});
    $('prompt').addEventListener('input',()=>{state().draft=$('prompt').value;$('prompt').style.height='auto';$('prompt').style.height=Math.min($('prompt').scrollHeight,140)+'px';syncSend()});
    $('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(state().stage!=='running')send()}});
    $('search').addEventListener('input',renderSidebar);
    $('chatScroll').addEventListener('scroll',()=>{$('jumpBottom').hidden=$('chatScroll').scrollHeight-$('chatScroll').scrollTop-$('chatScroll').clientHeight<150});
    $('dialogForm').addEventListener('submit',e=>{e.preventDefault();const s=state(),name=$('dialogName').value.trim();if(!name)return;if(dialogMode==='rename'){s.title=name;$('topTitle').textContent=name;renderSidebar();toast('会话已重命名')}if(dialogMode==='save'){s.result=name;s.saved=true;s.turns.push({role:'assistant',text:'已模拟保存为草稿「'+name+'」，共 8 条记录。你可以在右侧查看草稿摘要。',result:true});renderMessages();renderWorkspace();bottom();toast('已模拟保存 · 未写入真实项目')}$('dialog').close()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawers();$('threadMenu').hidden=true;$('modelMenu').hidden=true;$('menuTrigger').setAttribute('aria-expanded','false');$('modelTrigger').setAttribute('aria-expanded','false')}if(e.target.matches('[data-tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=workspaceState().openTabs;let index=tabs.indexOf(tab);index=e.key==='Home'?0:e.key==='End'?tabs.length-1:(index+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;openTab(tabs[index]);$('tab-'+tab).focus()}});
    let dragging=false;const resizeTo=w=>{w=Math.round(Math.max(330,Math.min(w,650,innerWidth-$('projectNav').getBoundingClientRect().width-($('app').classList.contains('no-sidebar')?0:$('conversationSidebar').getBoundingClientRect().width)-365)));document.documentElement.style.setProperty('--workspace',w+'px');$('resize').setAttribute('aria-valuenow',w)};
    $('resize').addEventListener('pointerdown',e=>{dragging=true;$('resize').setPointerCapture(e.pointerId);document.body.style.userSelect='none'});$('resize').addEventListener('pointermove',e=>{if(dragging)resizeTo(innerWidth-e.clientX)});const endDrag=()=>{dragging=false;document.body.style.userSelect=''};$('resize').addEventListener('pointerup',endDrag);$('resize').addEventListener('pointercancel',endDrag);$('resize').addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();resizeTo($('workspace').getBoundingClientRect().width+(e.key==='ArrowLeft'?20:-20))}});
    $('app').classList.add('no-workspace');if(innerWidth<=900)$('app').classList.add('no-sidebar');syncPanels();
    renderAll();
  </script>
</body>
</html>
