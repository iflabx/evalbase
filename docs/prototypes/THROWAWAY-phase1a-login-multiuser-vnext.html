<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>THROWAWAY · EvalBase 登录与多人工作流原型</title>
    <style>
      /* Visual baseline adapted from frontend-v1/src/styles.css. */
      :root {
        --bg: oklch(0.976 0.004 250);
        --surface: oklch(1 0 0);
        --surface-soft: oklch(0.968 0.007 247.9);
        --ink: oklch(0.243 0.028 260);
        --muted: oklch(0.552 0.026 262);
        --line: oklch(0.917 0.011 255);
        --blue: oklch(0.546 0.215 262.9);
        --blue-soft: oklch(0.955 0.014 255);
        --green: oklch(0.63 0.12 152);
        --amber: oklch(0.72 0.14 70);
        --danger: oklch(0.6 0.19 25);
        --radius: 10px;
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        color: var(--ink);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 320px;
        background: var(--bg);
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px solid color-mix(in oklab, var(--blue), white 45%);
        outline-offset: 2px;
      }
      .prototype-note {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 9px 18px;
        background: #fff6d8;
        border-bottom: 1px solid #eed486;
        color: #725300;
        font-size: 12px;
      }
      .prototype-note strong {
        letter-spacing: 0.06em;
      }
      .shell {
        display: grid;
        grid-template-columns: 230px minmax(0, 1fr);
        min-height: calc(100vh - 39px);
      }
      .rail {
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 22px 14px;
        border-right: 1px solid var(--line);
        background: var(--surface);
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 0 8px;
      }
      .brand-mark {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: var(--blue);
        color: white;
        font-weight: 800;
      }
      .brand strong,
      .brand span {
        display: block;
      }
      .brand strong {
        font-size: 14px;
      }
      .brand span {
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
      }
      .nav-label {
        margin: 0 8px 7px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.09em;
      }
      .nav {
        display: grid;
        gap: 4px;
      }
      .nav button {
        width: 100%;
        display: flex;
        gap: 10px;
        align-items: center;
        border: 0;
        border-radius: 7px;
        padding: 10px 11px;
        background: transparent;
        color: var(--ink);
        text-align: left;
      }
      .nav button:hover {
        background: var(--surface-soft);
      }
      .nav button.active {
        background: var(--blue-soft);
        color: var(--blue);
        font-weight: 700;
      }
      .nav-icon {
        width: 18px;
        text-align: center;
      }
      .rail-foot {
        margin-top: auto;
        padding: 10px 8px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .main {
        min-width: 0;
        padding: clamp(18px, 3vw, 42px);
      }
      .page-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 25px;
      }
      h1 {
        margin: 0;
        font-size: clamp(25px, 3vw, 34px);
        letter-spacing: -0.04em;
      }
      .subhead {
        max-width: 680px;
        margin: 8px 0 0;
        color: var(--muted);
        line-height: 1.6;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 12px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 4px color-mix(in oklab, var(--green), white 85%);
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        min-height: 540px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 18px 52px rgba(35, 53, 83, 0.07);
      }
      .directory {
        min-width: 0;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        background: color-mix(
          in oklab,
          var(--surface),
          var(--surface-soft) 42%
        );
      }
      .crumb {
        display: flex;
        gap: 7px;
        align-items: center;
        min-width: 0;
        font-size: 13px;
        font-weight: 700;
      }
      .crumb span {
        color: var(--muted);
        font-weight: 400;
      }
      .search {
        width: min(280px, 38%);
        margin-left: auto;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 8px 10px;
        background: white;
        color: var(--ink);
      }
      .view-toggle {
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 8px 9px;
        background: white;
        color: var(--muted);
      }
      .listing {
        padding: 8px 16px 16px;
      }
      .row-head,
      .file-row {
        display: grid;
        grid-template-columns: minmax(220px, 460px) 92px 140px 100px 32px;
        gap: 14px;
        align-items: center;
        justify-content: start;
      }
      .row-head {
        padding: 10px 9px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
      }
      .file-row {
        width: 100%;
        border: 0;
        border-top: 1px solid var(--line);
        padding: 13px 9px;
        background: transparent;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }
      .file-row:hover,
      .file-row.selected {
        background: var(--blue-soft);
      }
      .file-row:focus-visible {
        position: relative;
        z-index: 1;
        outline: 2px solid var(--blue);
        outline-offset: -2px;
      }
      .enter-row {
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--blue);
        font-size: 22px;
        line-height: 1;
      }
      .enter-row:hover {
        background: var(--blue-soft);
      }
      .inspector {
        padding: 22px 20px;
        border-left: 1px solid var(--line);
        background: var(--surface-soft);
      }
      .eyebrow {
        color: var(--blue);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      .inspector h2 {
        margin: 9px 0 8px;
        overflow-wrap: anywhere;
        font-size: 18px;
        letter-spacing: -0.025em;
      }
      .inspector p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }
      .meta {
        display: grid;
        gap: 8px;
        margin: 18px 0;
      }
      .meta div {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .meta span {
        color: var(--muted);
      }
      .file-name {
        display: flex;
        gap: 10px;
        align-items: center;
        min-width: 0;
      }
      .file-symbol {
        width: 30px;
        height: 32px;
        display: grid;
        place-items: center;
        border: 1px solid color-mix(in oklab, var(--blue), white 70%);
        border-radius: 6px;
        background: white;
        color: var(--blue);
        font-size: 10px;
        font-weight: 800;
      }
      .file-name strong,
      .file-name small {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .file-name strong {
        display: block;
        font-size: 13px;
      }
      .file-name small {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 11px;
      }
      .plain {
        color: var(--muted);
        font-size: 12px;
      }
      .badge {
        display: inline-flex;
        width: fit-content;
        border-radius: 999px;
        padding: 4px 7px;
        background: #e9f8f2;
        color: #17735b;
        font-size: 11px;
        font-weight: 700;
      }
      .badge.editing {
        background: #fff6d8;
        color: #7b5900;
      }
      .preview {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: white;
      }
      .preview-head {
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }
      .preview div {
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .preview div:last-child {
        border: 0;
      }
      .source {
        margin-top: 16px;
        padding: 11px;
        border-radius: 7px;
        background: var(--blue-soft);
        color: #315d9c;
        font-size: 12px;
        line-height: 1.55;
      }
      .browser {
        display: block;
        min-height: 540px;
      }
      .browser-top {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 18px;
        padding: 22px 24px 18px;
        border-bottom: 1px solid var(--line);
      }
      .back {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        margin: 0 0 15px;
        border: 0;
        padding: 0;
        background: transparent;
        color: var(--blue);
        font-size: 13px;
        font-weight: 700;
      }
      .browser-top h2 {
        margin: 0;
        font-size: 21px;
        letter-spacing: -0.025em;
      }
      .browser-top p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .browser-meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: end;
      }
      .browser-meta span {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 9px;
        background: var(--surface-soft);
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }
      .browser-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: end;
      }
      .mapping-note {
        margin: 16px 24px 0;
        padding: 11px 13px;
        border: 1px solid color-mix(in oklab, var(--blue), white 74%);
        border-radius: 8px;
        background: var(--blue-soft);
        color: #315d9c;
        font-size: 12px;
        line-height: 1.55;
      }
      .record-table-wrap {
        overflow: auto;
        margin: 16px 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .record-table {
        width: 100%;
        min-width: 680px;
        border-collapse: collapse;
        background: white;
        text-align: left;
      }
      .record-table th,
      .record-table td {
        padding: 12px 13px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        font-size: 12px;
        line-height: 1.55;
      }
      .record-table th {
        background: var(--surface-soft);
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.04em;
      }
      .record-table tr:last-child td {
        border-bottom: 0;
      }
      .record-table th:first-child,
      .record-table td:first-child {
        width: 64px;
        color: var(--muted);
      }
      .record-table th:last-child,
      .record-table td:last-child {
        width: 120px;
        color: var(--muted);
      }
      .pagination {
        display: flex;
        align-items: center;
        justify-content: end;
        gap: 10px;
        padding: 0 24px 22px;
        color: var(--muted);
        font-size: 12px;
      }
      .pagination .button {
        padding: 7px 10px;
        font-size: 12px;
      }
      .provenance {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin: 16px 24px 24px;
      }
      .provenance-card {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-soft);
      }
      .provenance-card h3 {
        margin: 0 0 8px;
        font-size: 12px;
      }
      .provenance-card p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }
      .fab {
        position: fixed;
        right: 34px;
        bottom: 30px;
        display: flex;
        align-items: center;
        gap: 9px;
        border: 0;
        border-radius: 999px;
        padding: 14px 18px;
        background: var(--blue);
        color: white;
        box-shadow: 0 12px 26px rgba(32, 81, 196, 0.32);
        font-weight: 800;
      }
      .fab:hover {
        transform: translateY(-1px);
      }
      .empty {
        display: grid;
        place-items: center;
        min-height: 380px;
        padding: 32px;
        text-align: center;
      }
      .empty-symbol {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        margin-bottom: 12px;
        border-radius: 16px;
        background: var(--blue-soft);
        color: var(--blue);
        font-size: 24px;
      }
      .empty h2 {
        margin: 0;
        font-size: 18px;
      }
      .empty p {
        max-width: 390px;
        color: var(--muted);
        line-height: 1.6;
      }
      .modal-backdrop {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 18px;
        background: rgba(20, 31, 48, 0.38);
        backdrop-filter: blur(4px);
      }
      .modal {
        width: min(800px, 100%);
        max-height: min(720px, calc(100vh - 36px));
        overflow: auto;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 14px;
        background: white;
        box-shadow: 0 28px 80px rgba(16, 24, 40, 0.28);
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        padding: 20px 22px;
        border-bottom: 1px solid var(--line);
      }
      .modal-head h2 {
        margin: 0;
        font-size: 20px;
      }
      .modal-head p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .close {
        width: 30px;
        height: 30px;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: white;
        color: var(--muted);
      }
      .steps {
        display: flex;
        gap: 7px;
        padding: 15px 22px 0;
        overflow: auto;
      }
      .step {
        display: flex;
        gap: 7px;
        align-items: center;
        white-space: nowrap;
        color: var(--muted);
        font-size: 12px;
      }
      .step b {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border-radius: 50%;
        background: var(--surface-soft);
        font-size: 11px;
      }
      .step.active {
        color: var(--blue);
        font-weight: 700;
      }
      .step.active b {
        background: var(--blue);
        color: white;
      }
      .modal-body {
        padding: 22px;
      }
      .drop {
        display: grid;
        place-items: center;
        min-height: 190px;
        border: 1.5px dashed color-mix(in oklab, var(--blue), white 45%);
        border-radius: 10px;
        background: linear-gradient(135deg, #f7faff, #fff);
        text-align: center;
      }
      .drop strong {
        display: block;
        margin-top: 8px;
      }
      .drop p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .file-choice {
        display: inline-flex;
        gap: 10px;
        align-items: center;
        margin-top: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        background: white;
      }
      .mapping {
        display: grid;
        grid-template-columns: 1fr 24px 1fr;
        gap: 10px;
        align-items: center;
        margin-bottom: 10px;
      }
      .mapping span {
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface-soft);
        font-size: 13px;
      }
      .mapping i {
        color: var(--muted);
        font-style: normal;
        text-align: center;
      }
      .check-list {
        display: grid;
        gap: 9px;
      }
      .check-list label {
        display: flex;
        gap: 10px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 11px;
      }
      .check-list label:has(input:checked) {
        border-color: color-mix(in oklab, var(--blue), white 40%);
        background: var(--blue-soft);
      }
      .selection-group {
        margin-top: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .selection-group h3 {
        margin: 0;
        padding: 11px 13px;
        border-bottom: 1px solid var(--line);
        background: var(--surface-soft);
        font-size: 13px;
      }
      .selection-group h3 small {
        color: var(--muted);
        font-weight: 400;
      }
      .record-choice {
        display: grid;
        grid-template-columns: auto minmax(0, 1.2fr) minmax(0, 1.5fr) minmax(
            90px,
            0.7fr
          );
        gap: 10px;
        align-items: start;
        padding: 11px 13px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        line-height: 1.5;
      }
      .record-choice:last-child {
        border-bottom: 0;
      }
      .record-choice small {
        color: var(--muted);
      }
      .edit-head,
      .edit-row {
        display: grid;
        grid-template-columns:
          34px minmax(150px, 1.2fr) minmax(150px, 1.5fr)
          minmax(100px, 0.8fr) auto;
        gap: 8px;
        align-items: center;
        padding: 10px 13px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .edit-head {
        background: var(--surface-soft);
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }
      .edit-row input {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px;
        color: var(--ink);
      }
      .delete-record {
        border: 0;
        padding: 6px;
        background: transparent;
        color: var(--danger);
        font-size: 12px;
      }
      .record-editor {
        width: 100%;
        min-height: 200px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 11px;
        color: var(--ink);
        line-height: 1.6;
      }
      .raw-note {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }
      .raw-code {
        max-height: 420px;
        overflow: auto;
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: #182431;
        color: #e3edf7;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 12px;
        line-height: 1.6;
        white-space: pre;
      }
      .modal-foot {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 16px 22px;
        border-top: 1px solid var(--line);
      }
      .button {
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 9px 13px;
        background: white;
        color: var(--ink);
        font-weight: 700;
      }
      .button.primary {
        border-color: var(--blue);
        background: var(--blue);
        color: white;
      }
      .button.ghost {
        border-color: transparent;
        color: var(--muted);
      }
      .button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      .toast {
        position: fixed;
        z-index: 20;
        left: 50%;
        bottom: 25px;
        transform: translateX(-50%);
        padding: 11px 15px;
        border: 1px solid #a6dfcc;
        border-radius: 8px;
        background: #e9f8f2;
        color: #126149;
        box-shadow: 0 9px 22px rgba(16, 24, 40, 0.12);
        font-size: 13px;
      }
      @media (max-width: 860px) {
        .shell {
          grid-template-columns: 1fr;
        }
        .rail {
          flex-direction: row;
          align-items: center;
          padding: 12px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .rail-foot {
          display: none;
        }
        .nav-label {
          display: none;
        }
        .nav {
          display: flex;
          margin-left: auto;
        }
        .nav button {
          width: auto;
        }
        .workspace:not(.browser) {
          grid-template-columns: 1fr;
        }
        .inspector {
          display: none;
        }
      }
      @media (max-width: 620px) {
        .prototype-note {
          align-items: start;
        }
        .main {
          padding: 18px 14px;
        }
        .page-head {
          align-items: start;
          flex-direction: column;
        }

      /*
       * Static equivalents of frontend-v1/src/styles.css and the donor's

      :root {

        --accent: oklch(0.955 0.014 255);
        --accent-foreground: oklch(0.243 0.028 260);
        --destructive: oklch(0.6 0.19 25);

        --input: oklch(0.917 0.011 255);
        --ring: oklch(0.546 0.215 262.9);

        --chart-2: oklch(0.63 0.12 152);
        --chart-3: oklch(0.6 0.09 230);
        --chart-4: oklch(0.66 0.16 300);
        --chart-5: oklch(0.72 0.14 70);
        --sidebar: oklch(1 0 0);

        --sidebar-primary: oklch(0.546 0.215 262.9);
        --sidebar-primary-foreground: oklch(1 0 0);
        --sidebar-accent: oklch(0.962 0.012 255);
        --sidebar-accent-foreground: oklch(0.33 0.09 262);
        --sidebar-border: oklch(0.917 0.011 255);
        --sidebar-ring: oklch(0.546 0.215 262.9);

        /* Existing prototype names point at the donor's semantic tokens. */
        --bg: var(--background);
        --surface: var(--card);
        --surface-soft: var(--secondary);
        --ink: var(--foreground);

                suggestion: "检查逗号和引号是否完整。",

      function runDeletionCheck() {
        const item = {
          versions: [
            { version: "v3", parentVersion: "v2" },
            { version: "v2", parentVersion: "v1" },
            { version: "v1", parentVersion: null },
          ],
        };
        const middle = versionDeletionPlan(item, "v2");
        const leaf = versionDeletionPlan(item, "v3");
        if (
          middle.isLeaf ||
          middle.descendants.map((entry) => entry.version).join(",") !== "v2,v3"
        )
          throw new Error("删除中间版本时必须包含所有后代。");
        if (!leaf.isLeaf || leaf.descendants[0].version !== "v3")

          !p1Collections.length ||
          !p2Collections.length ||
          p1Collections.some((collection) => collection.projectId !== "p1") ||
          p2Collections.some((collection) => collection.projectId !== "p2") ||
          p1Sets.some((set) => set.projectId !== "p1") ||
          p2Sets.some((set) => set.projectId !== "p2") ||
          !unfiledCollectionId("p1") ||
          !unfiledCollectionId("p2")
        )
          throw new Error("项目必须隔离数据集、测试集和未整理入口。");
        return "project workspace check passed";

      function runVersionSummaryCheck() {

          sampleRecords: [
            { question: "", prediction: "A", metadata: "x", origin: { asset: "资料 A", record: "1" } },
            { question: "重复", prediction: "B", metadata: "y", origin: { asset: "资料 A", record: "2" } },
            { question: "重复", prediction: "B", metadata: "y", origin: {} },
          ],
        });
        if (
          checks.missingQuestion !== 1 ||
          checks.duplicates !== 1 ||
          checks.traceable !== 2

          throw new Error("版本核对必须统计空问题、完全重复和来源记录。");

      function runRecordFilterCheck() {
        const sourced = {

          prediction: "A",
          metadataEntries: [
            { key: "分类", value: "预约" },
            { key: "渠道", value: "公开" },

          metadata: "分类: 预约 · 渠道: 公开",
          origin: { asset: "资料 A.csv", assetId: "a", record: "统一记录 1" },

        const anotherSource = {
          question: "已填写",
          prediction: "B",
          metadata: "账户",
          origin: { asset: "资料 B.json", assetId: "b", record: "统一记录 2" },
        };
        const manual = {
          question: "手工补充",
          prediction: "C",
          metadata: "预约 · 手工补充",
          origin: null,
        };
        const sourceFilter = {
          sourceFiles: ["资料 A.csv", "资料 B.json"],
          question: "all",
          origin: "all",
          metadataField: "all",
          metadata: "",
        };
        if ([sourced, anotherSource, manual].filter((record) => recordMatchesVersionFilters(record, sourceFilter)).length !== 2)
          throw new Error("来源多选必须匹配任一已选文件。 ");
        if (!recordMatchesVersionFilters(sourced, { ...sourceFilter, question: "missing", origin: "source", metadata: "预约" }))
          throw new Error("版本记录筛选必须同时应用来源、问题和 Metadata 条件。");
        if (recordMatchesVersionFilters(anotherSource, { ...sourceFilter, question: "missing", origin: "source", metadata: "预约" }))
          throw new Error("不满足任一条件的记录不得保留。");
        if (!recordMatchesVersionFilters(manual, { sourceFiles: [], question: "all", origin: "manual", metadata: "手工" }))
          throw new Error("手工新增和 Metadata 包含必须可筛选。");
        if (!recordMatchesVersionFilters(sourced, { sourceFiles: [], question: "all", origin: "all", metadataField: "渠道", metadata: "公开" }))
          throw new Error("Metadata 指定字段必须匹配对应的值。");
        if (recordMatchesVersionFilters(sourced, { sourceFiles: [], question: "all", origin: "all", metadataField: "渠道", metadata: "预约" }))
          throw new Error("Metadata 指定字段不得匹配其他字段的值。");
        return "record filter check passed";

      function runVersionGraphCheck() {
        const versions = [
          { version: "v3-b1", parentVersion: "v2-b1", publicationOrder: 5 },
          { version: "v2", parentVersion: "v1", publicationOrder: 2 },
          { version: "v1", parentVersion: null, publicationOrder: 1 },
          { version: "v2-b1", parentVersion: "v1", publicationOrder: 3 },
          { version: "v3", parentVersion: "v2", publicationOrder: 4 },
        ];
        const path = versionPath(versions, "v3-b1");
        if (
          path.size !== 3 ||
          !path.has("v1") ||
          !path.has("v2-b1") ||
          path.has("v2")
        )
          throw new Error("版本图只能高亮当前版本的祖先路径。");
        const children = versions
          .filter((entry) => entry.parentVersion === "v1")
          .sort((left, right) => left.publicationOrder - right.publicationOrder)
          .map((entry) => entry.version)
          .join(",");
        if (children !== "v2,v2-b1")
          throw new Error("同一父版本的分支必须按发布顺序稳定显示。");
        return "version graph check passed";

      function runLineageCheck() {
        const item = mock.sets[0];
        const current = item.versions.find((entry) => entry.version === "v3");
        const facts = lineageFacts(current);
        const states = new Set(facts.map((record) => record.changeType));
        if (!["inherited", "modified", "added", "deleted"].every((state) => states.has(state)))
          throw new Error("示例血缘必须同时覆盖沿用、修改、新增和移除。");
        const modified = facts.find((record) => record.changeType === "modified");
        const deleted = facts.find((record) => record.changeType === "deleted");
        if (!modified?.parentRevisionId || !modified.changedFields.length || !deleted?.parentRevisionId)
          throw new Error("修改和移除事实必须保留父用例修订与字段变化。");
        const csv = provenanceCsv(current);
        if (!csv.includes("稳定用例标识,用例修订,父用例修订,本版本状态,修改字段"))
          throw new Error("溯源 CSV 必须导出记录级身份和变化字段。");
        const parent = item.versions.find((entry) => entry.version === "v2");
        const candidate = buildVersionLineage("check", "v3-b1", parent, [
          { ...parent.sampleRecords[0] },
          { ...parent.sampleRecords[1], prediction: "已修改" },
          { question: "手工新增", prediction: "", metadata: "", origin: null },
        ]);
        if (
          candidate.sampleRecords.filter((record) => record.changeType === "modified").length !== 1 ||
          candidate.sampleRecords.filter((record) => record.changeType === "added").length !== 1 ||
          candidate.removedLineage.length !== parent.sampleRecords.length - 2
        )
          throw new Error("新版本必须独立生成修改、新增和移除事实。");
        return "lineage model check passed";
      }

        return "record count check passed";

      const baseActions = window.app;
