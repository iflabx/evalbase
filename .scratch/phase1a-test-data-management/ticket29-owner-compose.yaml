services:
  postgres:
    environment:
      POSTGRES_DB: agentbench_v2_ticket29_owner
      POSTGRES_USER: agentbench_ticket29_owner
      POSTGRES_PASSWORD: synthetic-nonproduction-only
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U agentbench_ticket29_owner -d agentbench_v2_ticket29_owner",
        ]

  minio:
    environment:
      MINIO_ROOT_USER: agentbench-ticket29-owner
      MINIO_ROOT_PASSWORD: synthetic-nonproduction-only

  web:
    environment: &owner-environment
      DATABASE_URL: postgresql://agentbench_ticket29_owner:synthetic-nonproduction-only@postgres:5432/agentbench_v2_ticket29_owner
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: agentbench-ticket29-owner
      MINIO_SECRET_KEY: synthetic-nonproduction-only
      MINIO_BUCKET: agentbench-v2-ticket29-owner
      APP_ORIGIN: http://127.0.0.1:4209
      GIT_SHA: ${GIT_SHA:-unknown}
      SOLO_OWNER_MODE: "true"
      OWNER_PASSWORD: owner-test-password
      ALLOW_TEST_IDENTITY: "false"
    ports: !override
      - "127.0.0.1:4209:3000"

  worker:
    environment:
      <<: *owner-environment
      WORKER_HEALTH_PORT: "3001"

networks:
  edge:
    name: agentbench-ticket29-owner-checkpoint-edge
    ipam:
      config:
        - subnet: 10.254.56.0/24
  internal:
    name: agentbench-ticket29-owner-checkpoint-internal
    internal: true
    ipam:
      config:
        - subnet: 10.254.57.0/24

volumes:
  postgres-data:
    name: agentbench-ticket29-owner-checkpoint-postgres-data
  minio-data:
    name: agentbench-ticket29-owner-checkpoint-minio-data
