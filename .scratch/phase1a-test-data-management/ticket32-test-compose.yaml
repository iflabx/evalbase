services:
  postgres:
    environment:
      POSTGRES_DB: agentbench_v2_ticket32_test
      POSTGRES_USER: agentbench_ticket32_test
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U agentbench_ticket32_test -d agentbench_v2_ticket32_test",
        ]

  minio:
    environment:
      MINIO_ROOT_USER: agentbench-ticket32-test

  test:
    command:
      [
        "sh",
        "-lc",
        "npm run db:migrate && npx vitest run tests/integration/solo-test-set-trash.test.ts",
      ]
    environment:
      DATABASE_URL: postgresql://agentbench_ticket32_test:synthetic-nonproduction-only@postgres:5432/agentbench_v2_ticket32_test
      MINIO_ACCESS_KEY: agentbench-ticket32-test
      MINIO_BUCKET: agentbench-v2-ticket32-test

networks:
  edge:
    name: agentbench-ticket32-test-edge
    ipam:
      config:
        - subnet: 10.254.62.0/24
  internal:
    name: agentbench-ticket32-test-internal
    ipam:
      config:
        - subnet: 10.254.63.0/24

volumes:
  postgres-data:
    name: agentbench-ticket32-test-postgres-data
  minio-data:
    name: agentbench-ticket32-test-minio-data
