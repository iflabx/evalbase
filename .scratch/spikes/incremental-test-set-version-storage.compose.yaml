name: evalbase-incremental-storage-spike-run1

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
    environment:
      POSTGRES_DB: spike
      POSTGRES_USER: spike
      POSTGRES_PASSWORD: synthetic-nonproduction-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spike -d spike"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]
    volumes: [postgres-data:/var/lib/postgresql/data]

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: spike
      MINIO_ROOT_PASSWORD: synthetic-nonproduction-only
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]
    volumes: [minio-data:/data]

  spike:
    image: public.ecr.aws/docker/library/node@sha256:9b741b28148b0195d62fa456ed84dd6c953c1f17a3761f3e6e6797a754d9edff
    working_dir: /workspace
    command: ["npm", "run", "spike:incremental"]
    environment:
      DATABASE_URL: postgresql://spike:synthetic-nonproduction-only@postgres:5432/spike
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: spike
      MINIO_SECRET_KEY: synthetic-nonproduction-only
      MINIO_BUCKET: evalbase-incremental-storage-spike
      SPIKE_ISOLATED: "1"
      GIT_SHA: ${GIT_SHA:-unknown}
      SPIKE_REPORT_PATH: /workspace/docs/spikes/incremental-test-set-version-storage.json
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [internal]
    volumes:
      - ../..:/workspace

networks:
  internal:
    name: evalbase-incremental-storage-spike-run1-internal
    internal: true

volumes:
  postgres-data:
    name: evalbase-incremental-storage-spike-run1-postgres-data
  minio-data:
    name: evalbase-incremental-storage-spike-run1-minio-data
