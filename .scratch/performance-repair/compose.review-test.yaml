name: evalbase-performance-repair-review
services:
  postgres:
    image: public.ecr.aws/docker/library/postgres@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      POSTGRES_DB: evalbase_performance_repair_review
      POSTGRES_USER: performance_repair
      POSTGRES_PASSWORD: synthetic-repair-only
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U performance_repair -d evalbase_performance_repair_review"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [internal]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: performance-repair
      MINIO_ROOT_PASSWORD: synthetic-repair-only
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [internal]
    volumes: ["minio-data:/data"]
  test:
    image: evalbase-architecture-performance:1d62240
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 3g
    user: "1000:1000"
    working_dir: /workspace
    entrypoint: [node]
    command: [-e, "setInterval(()=>{},60000)"]
    volumes: ["../../:/workspace"]
    environment:
      DATABASE_URL: postgresql://performance_repair:synthetic-repair-only@postgres:5432/evalbase_performance_repair_review
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: performance-repair
      MINIO_SECRET_KEY: synthetic-repair-only
      MINIO_BUCKET: evalbase-performance-repair-review-tests
      APP_ORIGIN: http://127.0.0.1:3000
      NODE_ENV: test
      SOLO_OWNER_MODE: "true"
      ALLOW_TEST_IDENTITY: "true"
      OWNER_PASSWORD: owner-test-password
      WORKER_HEALTH_PORT: "0"
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks: [internal]
networks:
  internal: {name: evalbase-performance-repair-review-internal, internal: true}
volumes:
  postgres-data: {name: evalbase-performance-repair-review-postgres-data}
  minio-data: {name: evalbase-performance-repair-review-minio-data}
